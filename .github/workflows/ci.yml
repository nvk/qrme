name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build
        run: swift build --disable-sandbox

      - name: Run self-test
        run: swift run --disable-sandbox QRMe --self-test

      - name: Build service bundle
        run: ./scripts/build-service.sh

      - name: Package release artifact
        run: ./scripts/package-release.sh

      - name: Upload service artifact
        uses: actions/upload-artifact@v4
        with:
          name: QRMe.service
          path: |
            build/QRMe.service.zip
            build/QRMe.service.zip.sha256
